# nightly の重量ゲート。apps/api-fsharp/ci.sh をフル実行する
# (軽量ゲート / Pact Broker / gitleaks / Trivy / SBOM / ZAP / Schemathesis /
#  実 API E2E / 共通故障ケース / 証拠監査)。
# あわせて e2e ジョブで backend-lifecycle E2E (Playwright + 実 F# API) を無人実行する。
#
# - push 時の軽量ゲートは verify.yml → scripts/verify.sh
# - 全量検証は Pact Broker を含む必須検査の欠落を失敗にする
# - PR は関連パスの変更時だけ重量ジョブを実行し、結果集約を必須チェックにする
# - schedule / workflow_dispatch の失敗時だけ ci-nightly Issue に通知する
name: nightly

on:
  pull_request:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
  # workflow_dispatch を叩けない環境 (actions:write の無いエージェント) 向けの起動経路。
  # format.yml の .ci/format-request と同じパターン
  push:
    branches:
      - main
      - "claude/**"
      - "ralph/**"
    paths:
      - ".ci/nightly-request"

permissions:
  contents: read

jobs:
  scope:
    name: nightly 対象判定
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 変更パスを分類
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/nightly-scope.sh
          source scripts/lib/nightly-scope.sh
          NEED_NIGHTLY_HEAVY=0
          NEED_NIGHTLY_E2E=0

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            classify_nightly_paths <<<"$changed"
            printf 'nightly scope: heavy=%s e2e=%s\nchanged paths:\n%s\n' \
              "$NEED_NIGHTLY_HEAVY" "$NEED_NIGHTLY_E2E" "$changed"
          else
            # schedule / workflow_dispatch / 明示的な push 起動は常に全実行する。
            NEED_NIGHTLY_HEAVY=1
            NEED_NIGHTLY_E2E=1
          fi

          {
            echo "heavy=$NEED_NIGHTLY_HEAVY"
            echo "e2e=$NEED_NIGHTLY_E2E"
          } >> "$GITHUB_OUTPUT"

  heavy:
    name: ci.sh フル実行
    needs: scope
    if: needs.scope.outputs.heavy == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      # tools/Migrator と src/SalesManagement (ZAP / Schemathesis の標的) が使う DB。
      # 接続情報は Migrator の DATABASE_URL デフォルトと docker-compose.yml に合わせる
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: sales_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d sales_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gitleaks が git 履歴全体を走査する
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: WireMock を起動 (price-check の外部 API スタブ。無いと fuzz が 502 で不安定)
        working-directory: apps/api-fsharp
        run: |
          docker compose up -d wiremock
          for _ in $(seq 1 30); do
            curl -sf --max-time 2 http://localhost:8181/__admin/health >/dev/null 2>&1 && break
            sleep 1
          done
      - name: dotnet ローカルツールを復元 (fantomas / fsharplint / CycloneDX)
        working-directory: apps/api-fsharp
        run: dotnet tool restore
      - name: gitleaks をインストール (シークレット検出)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Trivy をインストール (脆弱性スキャン)
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: 共通ゲートと E2E の CLI を準備
        run: |
          sudo bash scripts/configure-ubuntu-apt.sh
          sudo apt-get install -y -q shellcheck bats
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/oasdiff/oasdiff@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          pip install ruff pytest
          npm install -g @ast-grep/cli
      - name: frontend と Playwright を準備
        working-directory: apps/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Pact Broker を起動
        env:
          PGPASSWORD: app
        run: |
          psql -h localhost -U app -d sales_management -c 'CREATE DATABASE pact_broker'
          docker run --rm -d --name fsharp-pact-broker --network host \
            -e PACT_BROKER_DATABASE_ADAPTER=postgres \
            -e PACT_BROKER_DATABASE_HOST=localhost \
            -e PACT_BROKER_DATABASE_USERNAME=app \
            -e PACT_BROKER_DATABASE_PASSWORD=app \
            -e PACT_BROKER_DATABASE_NAME=pact_broker \
            -e PACT_BROKER_BASIC_AUTH_USERNAME=pact \
            -e PACT_BROKER_BASIC_AUTH_PASSWORD=pact \
            -e PACT_BROKER_PUBLIC_HEARTBEAT=true \
            -e PACT_BROKER_PORT=9292 \
            pactfoundation/pact-broker:2.137.0-pactbroker2.118.0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://localhost:9292/diagnostic/status/heartbeat; then break; fi
            sleep 1
          done
          curl -fsS --max-time 2 http://localhost:9292/diagnostic/status/heartbeat

      - name: ci.sh 実行
        working-directory: apps/api-fsharp
        run: bash ci.sh

      - name: CI 成果物をアップロード (SARIF / SBOM / カバレッジ / レポート)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-results
          path: |
            ci-results/
            apps/api-fsharp/ci-results/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: backend-lifecycle E2E (Playwright)
    needs: scope
    if: needs.scope.outputs.e2e == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # playwright.config.ts の webServer が tools/Migrator → src/SalesManagement を
      # 起動するため、その接続先 DB を service コンテナで供給する
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: sales_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d sales_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Ubuntu APT 取得を安定化
        run: sudo bash scripts/configure-ubuntu-apt.sh
      - name: フロント依存をインストール
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile
      - name: Playwright ブラウザをインストール
        working-directory: apps/frontend
        run: pnpm exec playwright install --with-deps chromium

      # webServer の `dotnet run` を高速化する (起動タイムアウト内に収めるための事前ビルド)
      - name: API と Migrator を事前ビルド
        working-directory: apps/api-fsharp
        run: |
          dotnet build src/SalesManagement
          dotnet build tools/Migrator

      - name: backend-lifecycle E2E 実行 (API+フロントは webServer が自動起動)
        working-directory: apps/frontend
        run: pnpm test:e2e:backend

      - name: 失敗時に trace をアップロード
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: apps/frontend/test-results/
          retention-days: 14
          if-no-files-found: warn

  result:
    name: nightly 結果集約
    needs: [scope, heavy, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 対象ジョブの結果を検証
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          HEAVY_REQUIRED: ${{ needs.scope.outputs.heavy }}
          HEAVY_RESULT: ${{ needs.heavy.result }}
          E2E_REQUIRED: ${{ needs.scope.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          printf 'scope=%s heavy(required=%s,result=%s) e2e(required=%s,result=%s)\n' \
            "$SCOPE_RESULT" "$HEAVY_REQUIRED" "$HEAVY_RESULT" "$E2E_REQUIRED" "$E2E_RESULT"

          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "nightly scope 判定が完了していません" >&2
            exit 1
          fi
          if [[ "$HEAVY_REQUIRED" == "1" && "$HEAVY_RESULT" != "success" ]]; then
            echo "必須の heavy ジョブが成功していません: $HEAVY_RESULT" >&2
            exit 1
          fi
          if [[ "$E2E_REQUIRED" == "1" && "$E2E_RESULT" != "success" ]]; then
            echo "必須の E2E ジョブが成功していません: $E2E_RESULT" >&2
            exit 1
          fi

  notify-failure:
    name: nightly 失敗通知
    needs: result
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.result.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: ci-nightly Issue へエスカレーション
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-nightly --color d73a4a \
            --description "nightly CI の失敗" --force || true
          existing=$(gh issue list --label ci-nightly --state open \
            --json number --jq '.[0].number' || true)
          body=$(printf '%s\n\n%s' \
            "nightly CI が失敗しました: ${RUN_URL}" \
            "SARIF / trace / ログは run のアーティファクトを参照。原因分析は LESSONS.md の運用に従うこと。")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "nightly CI 失敗 ($(date -u +%Y-%m-%d))" \
              --label ci-nightly --body "$body"
          fi
